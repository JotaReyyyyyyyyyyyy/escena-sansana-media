name: Publicar en Instagram

# Cada 10 minutos revisa nube/cola.json y publica lo que ya toca.
# Todo lo que esta en la cola fue aprobado por Joaquin en el chat.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Armar todo en Instagram sin publicar"
        type: boolean
        default: false
      auditoria:
        description: "Revisar horarios y estados sin llamar a Instagram ni modificar la cola"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar horario, reserva y exclusion de historias manuales
        run: python -m unittest discover -s nube -p test_publicar.py
      - name: Publicar lo que toca
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FLOPA_KEY: ${{ secrets.FLOPA_KEY }}
          PRUEBA: ${{ inputs.prueba }}
          AUDITORIA: ${{ inputs.auditoria }}
          EVENTO: ${{ github.event_name }}
        run: python nube/publicar.py
