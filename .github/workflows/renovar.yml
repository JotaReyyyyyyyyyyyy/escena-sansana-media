name: Renovar token de Instagram

# El token dura 60 dias y cambia al renovarse. Una vez por semana se renueva y se
# guarda cifrado como secreto IG_TOKEN. Necesita el secreto GH_PAT (permiso de
# escritura de secretos de este repo).
on:
  schedule:
    - cron: "23 14 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovar-token
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Renovar y guardar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FLOPA_KEY: ${{ secrets.FLOPA_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta GH_PAT con Secrets: write sobre este repo. No se solicito renovacion a Instagram."
            exit 1
          fi
          if [ -z "$IG_TOKEN" ]; then
            echo "::error::Falta IG_TOKEN."
            exit 1
          fi
          trap 'rm -f "$RUNNER_TEMP/t"' EXIT
          umask 077
          python nube/renovar.py "$RUNNER_TEMP/t" "$RUNNER_TEMP/renovacion.json"
          echo "::add-mask::$(cat "$RUNNER_TEMP/t")"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/t"
          rm -f "$RUNNER_TEMP/t"
          echo "Renovacion guardada correctamente en el secreto IG_TOKEN."
      - name: Guardar evidencia sin credenciales
        uses: actions/upload-artifact@v4
        with:
          name: renovacion-${{ github.run_id }}
          path: ${{ runner.temp }}/renovacion.json
          retention-days: 90
